  </defs>
  <!-- Rounded Cute App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Pot Handle Top -->
  <path d="M210 155 Q256 115 302 155" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
