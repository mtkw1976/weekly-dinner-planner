  <circle cx="209" cy="250" r="5" fill="#ffffff"/>
  <circle cx="311" cy="250" r="5" fill="#ffffff"/>
  
  <!-- Cute Smile -->
  <path d="M242 275 Q256 290 270 275" fill="none" stroke="#372e2d" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Rosy Cheeks -->
